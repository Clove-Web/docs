input: ./src
output: .retype
url: docs.doughmination.gay
branding:
  title: Doughmination Docs
  logo: /media/logo_circle.png
  logoAlign: left
  colors:
    label:
      text: "#ffffff"
      background: "#9d00ff"
links:
  - text: Home
    link: index.md
    icon: home
editor:
  enabled: true
favicon: /media/logo_circle.png
generator:
  recase: all
markdown:
  lineBreaks: soft
meta:
  title: " | Doughmination Docs"
search:
  hotkeys:
    - "/"
  maxResults: 20
  minChars: 2
  mode: full
  noResultsFoundMsg: "No results"
  placeholder: Search
start:
  open: false
snippets:
  lineNumbers:
    - js
    - none
templating:
  enabled: true
  liquid: false
footer:
  copyright: "&copy; 2026 Clove Twilight - All Rights Reserved."
  links:
    - text: doughmination
      link: https://github.com/doughmination